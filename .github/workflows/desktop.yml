name: Build Desktop

on:
  push:
    branches: [main, feat/*]
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "assets/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "assets/**"

env:
  CARGO_TERM_COLOR: always
  # Avoid interactive prompts in CI
  CI: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: KimiCodeDashboard-Windows-x86_64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: KimiCodeDashboard-Linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: KimiCodeDashboard-macOS-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        # tauri-cli has no --manifest-path; run inside the crate dir.
        # --no-sign: repo may not have TAURI_SIGNING_* secrets yet.
        working-directory: desktop/src-tauri
        run: cargo tauri build --ci --no-sign --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            desktop/src-tauri/target/release/bundle/**/*
            desktop/src-tauri/target/${{ matrix.target }}/release/kimicode-dashboard*
            desktop/src-tauri/target/${{ matrix.target }}/release/Kimi Code Dashboard*
            desktop/src-tauri/target/release/kimicode-dashboard*
            desktop/src-tauri/target/release/Kimi Code Dashboard*
          if-no-files-found: warn

  release:
    # Only tag pushes like v1.2.0 create a GitHub Release — not PRs, not plain main pushes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.exe
            **/*.msi
            **/*.AppImage
            **/*.deb
            **/*.dmg
            **/*.zip
          generate_release_notes: true
